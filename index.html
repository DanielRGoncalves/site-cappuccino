<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- SINCRONIZAR COM js/config.js -->
    <title>Cheiro das Águas | Cappuccino para padarias</title>
    <meta name="description" content="Cappuccino com cacau 100% para padarias da Grande Vitória. Conheça o rendimento e peça uma degustação." />
    <link rel="canonical" href="https://cheirodasaguasgourmet.com.br/" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="Cheiro das Águas" />
    <meta property="og:title" content="Cheiro das Águas | Cappuccino para padarias" />
    <meta property="og:description" content="Cappuccino com cacau 100% para padarias da Grande Vitória. Conheça o rendimento e peça uma degustação." />
    <meta property="og:url" content="https://cheirodasaguasgourmet.com.br/" />
    <meta property="og:image" content="https://cheirodasaguasgourmet.com.br/img/og.jpg" />
    <meta property="og:image:alt" content="Pacote de cappuccino e logo Cheiro das Águas sobre fundo preto" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Cheiro das Águas | Cappuccino para padarias" />
    <meta name="twitter:description" content="Cappuccino com cacau 100% para padarias da Grande Vitória. Conheça o rendimento e peça uma degustação." />
    <meta name="twitter:image" content="https://cheirodasaguasgourmet.com.br/img/og.jpg" />
    <link rel="icon" type="image/png" sizes="32x32" href="img/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="img/apple-touch-icon.png" />
    <!-- /SINCRONIZAR -->

    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <header class="site-header" aria-label="Cabeçalho principal">
      <div class="container header-inner">
        <a
          href="#inicio"
          class="logo-wrap"
        >
          <!-- O espaço agora respeita a proporção circular do seu leão -->
          <img class="logo" width="140" height="168" alt="" />
          <span class="logo-fallback"></span>
        </a>

        <nav class="nav" id="site-nav" aria-label="Navegação principal">
          <a href="#produtos"></a>
          <a href="#porque"></a>
          <a href="#padarias"></a>
          <a href="#como"></a>
          <a href="#faq"></a>
          <a href="#contato"></a>
        </nav>

        <div class="header-actions">
          <button class="menu-toggle" type="button" aria-label="Abrir menu" aria-controls="site-nav" aria-expanded="false">
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              aria-hidden="true"
            >
              <path
                d="M4 7h16M4 12h16M4 17h16"
                stroke="currentColor"
                stroke-width="1.7"
                stroke-linecap="round"
              />
            </svg>
          </button>
        </div>
      </div>
    </header>

    <main id="inicio">
      <section class="hero" aria-labelledby="hero-title">
        <div class="container">
          <div class="hero-content">
            <h1 id="hero-title"></h1>
            <p id="hero-subtitle"></p>
            <div class="hero-cta">
              <a class="btn btn-primary" id="pedir-degustacao" href="#contato"></a>
              <a class="btn btn-secondary" id="ver-conta" href="#padarias"></a>
            </div>
          </div>
        </div>
      </section>

      <section
        class="section products-section"
        id="produtos"
        aria-labelledby="products-title"
      >
        <div class="container">
          <div class="section-heading">
            <h2 id="products-title"></h2>
            <p id="products-intro"></p>
          </div>

          <div class="products-grid"></div>
        </div>
      </section>

      <section class="section reasons-section" id="porque" aria-labelledby="porque-title">
        <div class="container">
          <div class="section-heading"><h2 id="porque-title"></h2></div>
          <div class="reasons-grid" id="porque-cards"></div>
        </div>
      </section>

      <section
        class="section bakery-section"
        id="padarias"
        aria-labelledby="padarias-title"
      >
        <div class="container">
          <div class="section-heading">
            <h2 id="padarias-title"></h2>
            <p id="padarias-description"></p>
          </div>

          <div class="calculator-card">
            <div class="calculator-fields">
              <div>
                <label for="calculator-product" id="calculator-product-label"></label>
                <select id="calculator-product" class="calculator-input"></select>
              </div>
              <div>
                <label for="calculator-price" id="calculator-price-label"></label>
                <input id="calculator-price" class="calculator-input" type="text" inputmode="decimal" autocomplete="off" />
              </div>
            </div>

            <div id="calculator-result" class="calculator-result" aria-live="polite" hidden>
              <dl>
                <div><dt id="calculator-cost-label"></dt><dd id="calculator-cost"></dd></div>
                <div><dt id="calculator-gain-label"></dt><dd id="calculator-gain"></dd></div>
                <div><dt id="calculator-margin-label"></dt><dd id="calculator-margin"></dd></div>
                <div><dt id="calculator-package-gain-label"></dt><dd id="calculator-package-gain"></dd></div>
              </dl>
              <p id="calculator-notice"></p>
            </div>
          </div>
        </div>
      </section>

      <section
        class="section preparation"
        id="preparo"
        aria-labelledby="preparo-title"
      >
        <div class="container">
          <div class="section-heading">
            <h2 id="preparo-title"></h2>
          </div>
          <div class="steps" id="preparo-steps"></div>
          <p id="preparo-dica"></p>
          <p id="preparo-rendimento"></p>
        </div>
      </section>

      <section class="section process-section" id="como" aria-labelledby="como-title">
        <div class="container">
          <div class="section-heading"><h2 id="como-title"></h2></div>
          <div class="process-grid" id="como-passos"></div>
        </div>
      </section>

      <section class="section faq-section" id="faq" aria-labelledby="faq-title">
        <div class="container">
          <div class="section-heading"><h2 id="faq-title"></h2></div>
          <div class="faq-list" id="faq-items"></div>
        </div>
      </section>

      <section class="brand-story" hidden>
        <div class="container">
          <div class="story-card">
            <div class="eyebrow"></div>
            <h2></h2>
            <p></p>
          </div>
        </div>
      </section>
    </main>

    <footer id="contato">
      <div class="container">
        <div class="section-heading"><h2 id="contact-title"></h2></div>
        <div class="footer-grid">
          <div class="footer-brand">
            <h3></h3>
          </div>

          <div>
            <div class="footer-meta" id="legal-name"></div>
            <div class="footer-meta" id="legal-cnpj"></div>
            <div class="footer-meta" id="legal-address"></div>
            <div class="footer-meta" style="margin-top: 12px">
              <strong id="storage-label"></strong> <span id="storage-text"></span>
            </div>
          </div>

          <div>
            <div class="footer-meta" style="margin-bottom: 12px">
              <strong id="contact-label"></strong>
            </div>
            <div class="socials">
              <a class="social-link" id="contact-whatsapp" href="#contato"></a>
              <a class="social-link" id="instagram-link" target="_blank" aria-label="Instagram"></a>
            </div>
          </div>
        </div>
        <div class="footer-bottom">
          <span id="copyright-prefix"></span> <span id="copyright-name"></span> <span id="copyright-text"></span>
        </div>
      </div>
    </footer>

    <a class="floating-whatsapp" id="floating-whatsapp" href="#contato"></a>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
